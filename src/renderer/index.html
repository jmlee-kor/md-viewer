<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP: 인라인/원격 스크립트 차단, 로컬 리소스만 허용.
      후속 단계에서 vendor/ 라이브러리(ESM)와 wasm 을 추가하며 필요한 만큼만 완화한다.
      ('unsafe-inline' style 은 초기 UI 편의를 위해 임시 허용 — 추후 제거 검토)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <title>md-viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <main class="placeholder">
        <h1>md-viewer</h1>
        <p>오프라인 Markdown 뷰어 — 스켈레톤 동작 확인</p>
        <p class="hint" id="status">초기화 중…</p>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
