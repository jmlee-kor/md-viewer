<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP: 로컬 리소스만 허용. 인라인 스크립트 차단 (모듈 스크립트는 'self').
      style 은 Lit 의 동적 스타일 편의를 위해 'unsafe-inline' 임시 허용.
      후속: D2 wasm 도입 시 'wasm-unsafe-eval' 추가.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
    />
    <title>md-viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <mdv-app></mdv-app>
    <script type="module" src="app.js"></script>
  </body>
</html>
